seed: 0
paths:
  root: /Users/adityajha/Downloads/CI harness/CI-harness
  data_dir: /Users/adityajha/Downloads/CI harness/CI-harness/data
  corpus_raw_dir: /Users/adityajha/Downloads/CI harness/CI-harness/data/corpus/raw
  corpus_processed_dir: /Users/adityajha/Downloads/CI harness/CI-harness/data/corpus/processed
  corpus_manifest_path: /Users/adityajha/Downloads/CI harness/CI-harness/data/corpus/manifest.json
  index_dir: /Users/adityajha/Downloads/CI harness/CI-harness/data/index
  eval_dir: /Users/adityajha/Downloads/CI harness/CI-harness/data/eval
  runs_dir: /Users/adityajha/Downloads/CI harness/CI-harness/runs
  scratch_runs_dir: /Users/adityajha/Downloads/CI harness/CI-harness/runs/scratch
  reports_dir: /Users/adityajha/Downloads/CI harness/CI-harness/reports
  cache_dir: /Users/adityajha/Downloads/CI harness/CI-harness/.cache
  prompts_dir: /Users/adityajha/Downloads/CI harness/CI-harness/prompts
  cassette_dir: /Users/adityajha/Downloads/CI harness/CI-harness/tests/cassettes
  baseline_path: /Users/adityajha/Downloads/CI harness/CI-harness/baseline.json
corpus:
  name: cbam_synthetic
  sources: []
  local_dir: /Users/adityajha/Downloads/CI harness/CI-harness/data/corpus/synthetic
  exclude:
  - README.md
  request_timeout_s: 60.0
  max_attempts: 3
  refetch: false
  user_agent: evalgate-corpus-fetcher/0.1 (+https://github.com/aquiadi/CI-harness)
tokenizer:
  _target_: evalgate.ingest.tokens.RegexTokenEstimator
  name: regex_word
  pattern: \w+|[^\w\s]
  tokens_per_word: 1.3
chunker:
  _target_: evalgate.chunking.section.SectionAwareChunker
  name: section_aware
  target_tokens: 384
  overlap_tokens: 0
  min_tokens: 48
  max_tokens: 768
  heading_patterns:
  - ^[ \t]*(TITLE|CHAPTER|SECTION)[ \t]+[IVXLC]+
  - ^[ \t]*Article[ \t]+\d+[a-z]?\b
  - ^[ \t]*ANNEX[ \t]+[IVXLC0-9]+
  - ^[ \t]*\d+(?:\.\d+)*[ \t]+[A-Z][^\n]{0,80}(?<![.])$
embedder:
  _target_: evalgate.embeddings.local.SentenceTransformerEmbedder
  name: local
  model: BAAI/bge-small-en-v1.5
  dim: 384
  batch_size: 64
  normalize: true
  query_prefix: 'Represent this sentence for searching relevant passages: '
  document_prefix: ''
  device: cpu
sparse:
  name: bm25_default
  k1: 1.2
  b: 0.75
  stopwords: en
  stemmer: none
retriever:
  _target_: evalgate.retrieval.hybrid.HybridRRFRetriever
  name: hybrid
  k: 10
  candidate_k: 32
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0
  rerank:
    enabled: false
generator:
  provider: extractive
  model: extractive-v1
  prompt: generation/answer_v1.md
  max_tokens: 0
  temperature: 0.0
  input_usd_per_mtok: 0.0
  output_usd_per_mtok: 0.0
  max_sentences: 3
  max_chunks: 3
  min_overlap: 2
judge:
  provider: heuristic
  model: rule-based-v1
  prompt: judge/rubric_v1.md
  max_tokens: 0
  temperature: 0.0
  max_attempts: 1
  axes:
  - groundedness
  - relevance
  - citation_correctness
  scale_min: 1
  scale_max: 5
  input_usd_per_mtok: 0.0
  output_usd_per_mtok: 0.0
  answers_from: reference
  run_id: null
pricing:
  model: claude-sonnet-4-6
  input_usd_per_mtok: 3.0
  output_usd_per_mtok: 15.0
probes:
  position_swap: true
  length_bias: true
  self_preference: true
  contrast_generator: haiku
  worst_disagreements: 10
api:
  mode: replay
  cache_enabled: true
  cache_path: /Users/adityajha/Downloads/CI harness/CI-harness/.cache/model_cache.sqlite
  max_retries: 3
  backoff_initial_s: 1.0
  backoff_max_s: 30.0
  timeout_s: 120.0
gate:
  baseline_path: /Users/adityajha/Downloads/CI harness/CI-harness/baseline.json
  quality_drop_pct: 2.0
  p95_latency_rise_pct: 20.0
  cost_per_query_rise_pct: 15.0
  composite_weights:
    groundedness: 0.3
    relevance: 0.2
    citation_correctness: 0.3
    recall_at_k: 0.2
evalsets:
  retrieval_path: /Users/adityajha/Downloads/CI harness/CI-harness/data/eval/retrieval.jsonl
  answers_path: /Users/adityajha/Downloads/CI harness/CI-harness/data/eval/answers.jsonl
  human_labels_path: /Users/adityajha/Downloads/CI harness/CI-harness/data/eval/human_labels.jsonl
  seed_labels_path: /Users/adityajha/Downloads/CI harness/CI-harness/data/eval/seed_labels.jsonl
  judge_scores_path: /Users/adityajha/Downloads/CI harness/CI-harness/data/eval/judge_scores.jsonl
  limit: null
ablation:
  chunkers:
  - fixed_token
  - recursive_structural
  - section_aware
  retrievers:
  - dense
  - bm25
  - hybrid
  k_values:
  - 3
  - 5
  - 10
  rerank:
  - false
  - true
label:
  mode: answers
  labeller: adityajha
  answers_from: reference
  run_id: null
  context_k: 5
  show_gold: false
  relabel: false
evalgen:
  prompt: evalgen/retrieval_candidates_v1.md
  model: claude-sonnet-4-6
  max_tokens: 2048
  temperature: 0.0
  max_attempts: 3
  target_slots: 120
  sample_chunks: 80
  max_questions_per_chunk: 2
  min_chunk_tokens: 60
  input_usd_per_mtok: 3.0
  output_usd_per_mtok: 15.0
