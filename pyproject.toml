[project]
name = "evalgate"
version = "0.1.0"
description = "A RAG system whose product is its evaluation harness: validated LLM judge, retrieval ablations, cost/latency/quality Pareto, and a CI gate that blocks quality regressions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.9.0",
    "anthropic>=0.40.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "lancedb>=0.15.0",
    "bm25s>=0.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "pypdf>=5.0.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
# Heavy local-model stack. Kept out of the default install so that lint, types,
# tests and replay-mode CI never pull torch. See docs/DECISIONS.md (D-0004).
ml = [
    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",
]

[project.scripts]
evalgate = "evalgate.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "pandas-stubs>=2.2.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "RUF",       # ruff rules
    "ANN",       # annotations
    "D",         # docstrings
]
ignore = [
    "D100",  # module docstring optional on private modules
    "D104",  # package docstring optional
    "D107",  # __init__ docstring: covered by class docstring
    "ANN401",  # Any is required at a few library boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "ANN201"]
"scripts/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
files = ["src", "tests", "scripts"]
plugins = []

[[tool.mypy.overrides]]
# Third-party packages without type information. Kept as an explicit, auditable
# list rather than a global ignore_missing_imports.
module = [
    "hydra.*",
    "bm25s.*",
    "lancedb.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: exercises a model download or a network call; excluded from `make check`",
    "live: performs a real paid API call; only run by the nightly workflow",
]
filterwarnings = ["error::DeprecationWarning:evalgate.*"]

[tool.coverage.run]
source = ["src/evalgate"]
branch = true
