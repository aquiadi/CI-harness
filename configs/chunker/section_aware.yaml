_target_: evalgate.chunking.section.SectionAwareChunker
name: section_aware
target_tokens: 768
overlap_tokens: 0
min_tokens: 48
max_tokens: 1536
# Legal-instrument headings. A chunk never spans two of these.
heading_patterns:
  - "^\\s*(TITLE|CHAPTER|SECTION)\\s+[IVXLC]+"
  - "^\\s*Article\\s+\\d+[a-z]?\\b"
  - "^\\s*ANNEX\\s+[IVXLC0-9]+"
  - "^\\s*\\d+(\\.\\d+)*\\s+[A-Z]"
