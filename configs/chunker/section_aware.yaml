_target_: evalgate.chunking.section.SectionAwareChunker
name: section_aware
target_tokens: 384
overlap_tokens: 0
min_tokens: 48
max_tokens: 768
# Legal-instrument headings. A chunk never spans two of these.
heading_patterns:
  - "^[ \\t]*(TITLE|CHAPTER|SECTION)[ \\t]+[IVXLC]+"
  - "^[ \\t]*Article[ \\t]+\\d+[a-z]?\\b"
  - "^[ \\t]*ANNEX[ \\t]+[IVXLC0-9]+"
  # A numbered heading is a short standalone line that does not end in a full
  # stop; without those guards a wrapped line beginning "31 July 2024." reads
  # as a section boundary.
  - "^[ \\t]*\\d+(?:\\.\\d+)*[ \\t]+[A-Z][^\\n]{0,80}(?<![.])$"
