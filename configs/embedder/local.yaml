# Default. Local, deterministic, free: the retrieval ablations cost nothing
# to re-run, which is the whole reason they get run at all.
_target_: evalgate.embeddings.local.SentenceTransformerEmbedder
name: local
model: BAAI/bge-small-en-v1.5
dim: 384
batch_size: 64
normalize: true
# bge-* models are trained with an asymmetric query instruction.
query_prefix: "Represent this sentence for searching relevant passages: "
document_prefix: ""
device: cpu
