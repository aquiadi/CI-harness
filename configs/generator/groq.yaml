# The answering model, served by Groq. Deliberately NOT the judge's model:
# a judge grading its own output confounds the self-preference probe, which
# can then only report that one generator scored higher, not why. See
# configs/generator/groq_large.yaml for the contrast arm.
provider: api
model: openai/gpt-oss-20b
prompt: generation/answer_v1.md
max_tokens: 1024
temperature: 0.0
input_usd_per_mtok: 0.0
output_usd_per_mtok: 0.0
