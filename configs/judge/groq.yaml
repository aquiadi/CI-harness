# The judge, served by Groq. `provider: api` means "an LLM behind the model
# client"; which vendor answers is api.provider.
#
# Qwen rather than the larger gpt-oss-120b, on measured behaviour rather than
# parameter count: gpt-oss will not emit a forced tool call at Groq's default
# reasoning effort -- it writes the verdict as prose and Groq rejects the
# response -- and only complies at `reasoning_effort: low`. Buying tool
# compliance by suppressing the judge's deliberation is a poor trade for the
# one component whose job is to deliberate. Qwen complies at default effort.
#
# configs/judge/groq_gptoss.yaml is the other arm. Which is the better judge
# is an empirical question, and this repository exists to answer it: run both
# against the human labels and compare kappa. Neither is validated yet.
#
# IMPORTANT: Groq retires model ids regularly -- llama-3.3-70b-versatile was
# already gone the first time this config was used. List what your key can
# actually reach:
#
#   curl -s https://api.groq.com/openai/v1/models \
#     -H "Authorization: Bearer $GROQ_API_KEY" | python3 -m json.tool
provider: api
model: qwen/qwen3.8-27b
prompt: judge/rubric_v1.md
# Sized by the free tier's output-tokens-per-minute quota, not by what a
# judgment needs. Groq charges the quota against the max_tokens a request asks
# for rather than what it returns, so a generous ceiling is not free: at 4096
# a single call exceeded a 1000 OTPM limit outright and could never succeed.
# A measured judgment is ~150 tokens, so this is roughly 2.5x what it uses
# while letting several calls through per minute.
max_tokens: 400
temperature: 0.0
max_attempts: 3
axes: [groundedness, relevance, citation_correctness]
scale_min: 1
scale_max: 5
# Free tier: measured cost is genuinely zero. The Pareto table's projected-cost
# column still prices the token footprint at configs/pricing/ rates.
input_usd_per_mtok: 0.0
output_usd_per_mtok: 0.0
answers_from: reference
run_id: null
