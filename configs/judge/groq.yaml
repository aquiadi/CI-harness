# The judge, served by Groq. `provider: api` means "an LLM behind the model
# client"; which vendor answers is api.provider.
#
# The largest general instruct model Groq serves, chosen deliberately: the
# judge is the measuring instrument, so it gets the strongest model available
# and the generator gets a weaker one. `groq/compound` is not a candidate --
# it is an agentic system that does its own tool calling, and this judge needs
# a single forced function call it controls.
#
# IMPORTANT: Groq retires model ids regularly, and `llama-3.3-70b-versatile`
# was already gone by the time this config was first used. Verify against
# https://console.groq.com/docs/models, or list what your key can actually
# reach:
#
#   curl -s https://api.groq.com/openai/v1/models \
#     -H "Authorization: Bearer $GROQ_API_KEY" | python3 -m json.tool
provider: api
model: openai/gpt-oss-120b
prompt: judge/rubric_v1.md
max_tokens: 1024
temperature: 0.0
max_attempts: 3
axes: [groundedness, relevance, citation_correctness]
scale_min: 1
scale_max: 5
# Free tier: measured cost is genuinely zero. The Pareto table's projected-cost
# column still prices the token footprint at configs/pricing/ rates.
input_usd_per_mtok: 0.0
output_usd_per_mtok: 0.0
answers_from: reference
run_id: null
