# The judge, served by Groq. `provider: api` means "an LLM behind the model
# client"; which vendor answers is api.provider.
#
# IMPORTANT: Groq retires model ids regularly. Verify this one against
# https://console.groq.com/docs/models before a long run, and override with
# ARGS="judge.model=<current-id>" if it has been replaced.
provider: api
model: llama-3.3-70b-versatile
prompt: judge/rubric_v1.md
max_tokens: 1024
temperature: 0.0
max_attempts: 3
axes: [groundedness, relevance, citation_correctness]
scale_min: 1
scale_max: 5
# Free tier: measured cost is genuinely zero. The Pareto table's projected-cost
# column still prices the token footprint at configs/pricing/ rates.
input_usd_per_mtok: 0.0
output_usd_per_mtok: 0.0
answers_from: reference
run_id: null
