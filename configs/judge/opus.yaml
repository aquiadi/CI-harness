# The judge must be swappable to a model other than the generator; this is the
# config used to check that judge conclusions are not an artefact of one model.
provider: anthropic
model: claude-opus-5
prompt: judge/rubric_v1.md
max_tokens: 1024
temperature: 0.0
max_attempts: 3
axes: [groundedness, relevance, citation_correctness]
scale_min: 1
scale_max: 5
input_usd_per_mtok: 5.0
output_usd_per_mtok: 25.0
# reference: grade the eval set's reference answers. run: grade a run's answers.
answers_from: reference
run_id: null
