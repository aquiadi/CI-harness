# Each corpus has its own eval set, because gold evidence is a verbatim span of
# the corpus it was copied from (D-0015): the synthetic corpus's questions
# cannot be scored against the real documents. The runner refuses an example
# whose corpus or spans do not match the corpus being measured.
retrieval_path: ${paths.eval_dir}/${corpus.name}/retrieval.jsonl
answers_path: ${paths.eval_dir}/${corpus.name}/answers.jsonl
human_labels_path: ${paths.eval_dir}/${corpus.name}/human_labels.jsonl
# Ratings authored alongside the seed answers. Not independent human labels;
# the calibration report reads them separately and says so. See D-0019.
seed_labels_path: ${paths.eval_dir}/${corpus.name}/seed_labels.jsonl
# Hand-written seed files that `make seed` materialises into the paths above.
seeds_dir: ${paths.eval_dir}/${corpus.name}/seeds
# One file per judge, named after its model, each with a .meta.json recording
# the stack it judged over. A second judge never overwrites the first.
judgments_dir: ${paths.eval_dir}/${corpus.name}/judgments
limit: null
