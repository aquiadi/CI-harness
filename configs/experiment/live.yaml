# @package _global_
# The system as it is meant to run: the real EU documents, local bge
# embeddings, an API generator and an API judge. This is what the nightly
# workflow measures against `baseline.live.json`.
#
# It needs `make corpus` to have fetched the sources, `make ml` for the local
# encoder, ANTHROPIC_API_KEY, and an accepted eval set for the real corpus
# under data/eval/cbam/ (the synthetic corpus's questions cannot be scored
# against the real documents, and the runner refuses to try). Freeze its
# baseline once, deliberately:
#   make freeze PROFILE="+experiment=live"
#
# PROFILE, not ARGS: the Makefile's default PROFILE is +experiment=baseline,
# and a second +experiment in ARGS is a composition error.
defaults:
  - override /corpus: cbam
  - override /chunker: recursive_structural
  - override /retriever: hybrid
  - override /embedder: local
  - override /generator: sonnet
  - override /judge: sonnet
  - override /api: live

retriever:
  k: 8
gate:
  baseline_path: ${paths.root}/baseline.live.json
